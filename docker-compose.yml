
services:
  postgres:
    image: postgres:17
    container_name: tcc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plataforma_tcc
      POSTGRES_USER: tcc_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcc_app -d plataforma_tcc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
