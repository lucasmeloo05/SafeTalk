# PostgreSQL descartável para os testes automatizados.
# Usa porta, container e volume distintos do banco de desenvolvimento.
services:
  postgres-test:
    image: postgres:17
    container_name: tcc-postgres-test
    restart: "no"
    environment:
      POSTGRES_DB: plataforma_tcc_test
      POSTGRES_USER: tcc_test
      POSTGRES_PASSWORD: tcc_test_only_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcc_test -d plataforma_tcc_test"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_test_data:
